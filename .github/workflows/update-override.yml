name: Build & Verify Lite Override

on:
  push:
    branches:
      - main
    paths:
      - 'custom-overrides.js'
      - 'scripts/**'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-lite-override
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and validate Lite override
        run: npm run check

      - name: Publish build summary
        run: npm run report >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lite-override-build-diagnostics
          path: dist/Lite-Override.js
          if-no-files-found: ignore

      - name: Commit generated Lite override
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update Lite override'
          file_pattern: 'dist/Lite-Override.js'
